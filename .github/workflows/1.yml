name: Manual Windows Artifact Build

on:
  push:
    branches: [ "main", "master" ] # ירוץ אוטומטית בכל דחיפה לענפים האלו
  workflow_dispatch: # מאפשר לך להפעיל את ה-Build גם ידנית בלחיצת כפתור

env:
  RELEASE_TAG: "latest"
  CONFIGURE: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc
    -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
  WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
  WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip

jobs:
  build:
    name: Build and package (Windows Artifact)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}

      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs

      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          save: false

      - name: Configure Windows
        shell: cmd
        run: cmake -S . -B build %CONFIGURE%

      - name: Build project (Windows)
        shell: cmd
        run: cmake --build build

      - name: Run tests (Windows)
        shell: cmd
        run: ctest --test-dir build --output-on-failure --timeout 120 --stop-on-failure --no-tests=error

      - name: Build patched libraries (Windows)
        shell: cmd
        run: cmake --build build --target libs

      - name: Package files
        run: python tools/package_release.py --platform "windows" --build build --output dist --version "$RELEASE_TAG"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-files
          path: dist/*
          if-no-files-found: error
          compression-level: 0
